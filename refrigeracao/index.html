<style>
/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*,::before,::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #1351B4;outline-offset:2px}
#topbar :focus-visible,#bottom-nav :focus-visible,#fab:focus-visible{outline-color:#fff;outline-offset:-3px}
html,body{margin:0;padding:0;height:100%;background:#F0F2F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;color:#1B1B1B;overflow:hidden}

/* ═══════════════════════════════════════════
   LAYOUT PRINCIPAL
═══════════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#topbar{background:#071D41;color:#fff;padding:0 16px;display:flex;align-items:center;gap:10px;height:56px;flex-shrink:0;z-index:10}
#topbar .logo{font-size:13px;font-weight:800;letter-spacing:.5px;line-height:1.1;flex:1}
#topbar .logo span{display:block;font-weight:400;font-size:11px;opacity:.7}
#topbar-action{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:8px;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
#topbar-action:active{background:rgba(255,255,255,.15)}

#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0)}
#content::-webkit-scrollbar{display:none}

/* ═══════════════════════════════════════════
   BOTTOM NAV
═══════════════════════════════════════════ */
#bottom-nav{
  background:#fff;
  border-top:1px solid #E0E0E0;
  display:flex;
  align-items:stretch;
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0);
  z-index:10;
  box-shadow:0 -2px 8px rgba(0,0,0,.08)
}
.nav-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:8px 4px;
  background:none;
  border:none;
  cursor:pointer;
  color:#888;
  font-size:10px;
  font-weight:600;
  letter-spacing:.2px;
  transition:color .15s;
  position:relative;
  -webkit-user-select:none;user-select:none
}
.nav-btn i{font-size:20px;line-height:1}
.nav-btn.active{color:#1351B4}
.nav-btn.active i{color:#1351B4}
.nav-badge{
  position:absolute;top:5px;right:50%;
  transform:translateX(calc(50% + 6px));
  background:#E52207;color:#fff;
  font-size:9px;font-weight:800;
  border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;
  line-height:14px
}

/* ═══════════════════════════════════════════
   PAGES
═══════════════════════════════════════════ */
.page{display:none;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 12px 20px}
.page::-webkit-scrollbar{display:none}
.page.active{display:block}

/* ═══════════════════════════════════════════
   KPI CARDS
═══════════════════════════════════════════ */
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi-wide{grid-column:1/-1}
.kpi-card{
  background:#fff;border-radius:12px;padding:14px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  border-left:4px solid #ccc;
  position:relative;overflow:hidden
}
.kpi-label{font-size:11px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.kpi-val{font-size:28px;font-weight:800;line-height:1;margin-bottom:2px}
.kpi-sub{font-size:11px;color:#999}

/* ═══════════════════════════════════════════
   SECTION HEADERS
═══════════════════════════════════════════ */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px;padding:0 2px}
.sec-title{font-size:13px;font-weight:700;color:#333;text-transform:uppercase;letter-spacing:.4px}
.sec-count{background:#E8ECF5;color:#1351B4;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.sec-ordem{margin-left:auto;margin-right:8px;font-size:11px;font-weight:600;color:#555;border:1.5px solid #E0E0E0;border-radius:8px;background:#fff;padding:3px 6px;max-width:52%}

/* ═══════════════════════════════════════════
   EQUIPMENT CARDS
═══════════════════════════════════════════ */
.equip-card{
  background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  display:flex;flex-direction:column;gap:6px;
  cursor:pointer;active-transform:.97;
  transition:transform .1s;
  border-left:4px solid #ddd
}
.equip-card:active{transform:scale(.98)}
.equip-card.ok{border-left-color:#168821}
.equip-card.nok{border-left-color:#E52207}
.equip-card.ver{border-left-color:#B46800}
.ec-row1{display:flex;align-items:flex-start;gap:8px}
.ec-num{font-size:11px;color:#aaa;font-weight:700;min-width:28px;padding-top:2px}
.ec-main{flex:1;min-width:0}
.ec-local{font-size:14px;font-weight:700;color:#1B1B1B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-predio{font-size:12px;color:#666;margin-top:1px}
.ec-status{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;line-height:1}
.pill-ok{background:#E6F4EA;color:#168821}
.pill-nok{background:#FDECEA;color:#E52207}
.pill-ver{background:#FEF3E2;color:#B46800}
.pill-crit{background:#FDECEA;color:#B71C1C}
.pill-alta{background:#FFF3E0;color:#E65100}
.pill-media{background:#E3F2FD;color:#1565C0}
.pill-baixa{background:#F1F8E9;color:#33691E}
.pill-tipo{background:#F3F4F6;color:#555}
.ec-info{display:flex;gap:12px;font-size:11px;color:#888}
.ec-info span i{margin-right:3px}

/* ═══════════════════════════════════════════
   SEARCH BAR
═══════════════════════════════════════════ */
.search-wrap{position:sticky;top:0;z-index:5;padding:8px 0 4px;background:#F0F2F5}
.search-box{
  width:100%;padding:10px 14px 10px 38px;
  border:1.5px solid #E0E0E0;border-radius:12px;
  font-size:15px;background:#fff;
  outline:none;transition:border .15s
}
.search-box:focus{border-color:#1351B4}
.search-wrap{position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa;font-size:15px;pointer-events:none}

/* ═══════════════════════════════════════════
   FILTER CHIPS
═══════════════════════════════════════════ */
.chips{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1.5px solid #E0E0E0;background:#fff;font-size:12px;font-weight:600;color:#666;cursor:pointer;transition:all .15s}
.chip.active{background:#1351B4;color:#fff;border-color:#1351B4}
.chip:active{opacity:.7}

/* ═══════════════════════════════════════════
   ALERT CARDS
═══════════════════════════════════════════ */
.alert-card{
  background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  display:flex;align-items:flex-start;gap:10px;
  border-left:4px solid #E52207;cursor:pointer
}
.alert-card:active{transform:scale(.98)}
.alert-icon{font-size:18px;margin-top:2px;flex-shrink:0}
.alert-body{flex:1;min-width:0}
.alert-title{font-size:13px;font-weight:700;color:#1B1B1B}
.alert-sub{font-size:12px;color:#666;margin-top:2px}
.alert-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;flex-shrink:0;align-self:flex-start}

/* ═══════════════════════════════════════════
   PMOC PAGE
═══════════════════════════════════════════ */
.pmoc-row{
  background:#fff;border-radius:10px;padding:12px;margin-bottom:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  display:flex;align-items:center;gap:8px;cursor:pointer
}
.pmoc-row:active{transform:scale(.98)}
.pmoc-info{flex:1;min-width:0}
.pmoc-predio{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmoc-local{font-size:12px;color:#666}
.due-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.due-late{background:#FDECEA;color:#E52207}
.due-soon{background:#FFF8E1;color:#F57F17}
.due-ok{background:#E6F4EA;color:#168821}
.due-none{background:#F5F5F5;color:#999}

/* ═══════════════════════════════════════════
   DRAWER / DETAIL MODAL
═══════════════════════════════════════════ */
#drawer{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;
  pointer-events:none;
}
#drawer.open{pointer-events:all}
#drawer-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.45);
  opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)
}
#drawer.open #drawer-overlay{opacity:1}
#drawer-panel{
  position:absolute;bottom:0;left:0;right:0;
  background:#fff;border-radius:20px 20px 0 0;
  max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)
}
#drawer.open #drawer-panel{transform:translateY(0)}
#drawer-handle{width:40px;height:4px;border-radius:2px;background:#DDD;margin:10px auto 0;flex-shrink:0}
#drawer-hdr{
  display:flex;align-items:flex-start;gap:12px;
  padding:16px 16px 12px;border-bottom:1px solid #F0F0F0;flex-shrink:0
}
#drawer-hdr-info{flex:1;min-width:0}
#dh-id{font-size:12px;color:#aaa;font-weight:600}
#dh-local{font-size:17px;font-weight:800;line-height:1.2;margin:2px 0 4px}
#dh-predio{font-size:13px;color:#666}
#drawer-body{overflow-y:auto;flex:1;padding:16px;-webkit-overflow-scrolling:touch}
#drawer-body::-webkit-scrollbar{display:none}
#drawer-footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));border-top:1px solid #F0F0F0;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}

/* ═══════════════════════════════════════════
   DETAIL SECTIONS
═══════════════════════════════════════════ */
.ds{background:#F8F9FA;border-radius:12px;padding:12px;margin-bottom:12px}
.ds-title{font-size:11px;font-weight:700;color:#1351B4;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dfield{margin-bottom:8px}
.dfield label{display:block;font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;font-weight:600}
.dfield .dval{font-size:14px;color:#1B1B1B;font-weight:500}
.dfields2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Log entries */
.log-entry{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:3px solid #1351B4}
.le-hdr{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.le-date{font-size:12px;font-weight:700;color:#1B1B1B}
.le-tipo{font-size:11px;background:#E8ECF5;color:#1351B4;padding:2px 7px;border-radius:5px;font-weight:600}
.le-status{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:600}
.le-desc{font-size:12px;color:#555;margin-top:4px;line-height:1.4}
.le-tec{font-size:11px;color:#999;margin-top:3px}
.le-chk{font-size:11px;color:#666;margin-top:4px}
.le-del{background:none;border:none;color:#E52207;cursor:pointer;padding:4px 8px;font-size:11px;font-weight:600;border-radius:6px;margin-top:4px}

/* Form elements */
.fgl{display:block;font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.fgi{width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;background:#fff;outline:none;transition:border .15s}
.fgi:focus{border-color:#1351B4}
.fgs{width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;background:#fff;outline:none;-webkit-appearance:none}
.fgt{width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;background:#fff;outline:none;resize:none;min-height:80px}
.fgt:focus,.fgi:focus,.fgs:focus{border-color:#1351B4}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fg-full{grid-column:1/-1}

/* Checklist */
.chk-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #F0F0F0;cursor:pointer}
.chk-item:last-child{border-bottom:none}
.chk-item input{width:18px;height:18px;margin:0;flex-shrink:0;margin-top:1px;accent-color:#1351B4}
.chk-item span{font-size:13px;color:#333;line-height:1.3}

/* Buttons */
.btn-primary{flex:1;background:#1351B4;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.btn-primary:active{background:#0C326F}
.btn-secondary{background:#F3F4F6;color:#333;border:none;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-secondary:active{background:#E5E7EB}
.btn-danger{background:#FDECEA;color:#E52207;border:none;border-radius:10px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer}
.btn-success{background:#168821;color:#fff;border:none;border-radius:10px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer}
.btn-sm{padding:7px 12px;font-size:12px;font-weight:700;border-radius:8px;border:none;cursor:pointer}
.btn-grow{flex:1}

.med-box{display:grid;gap:6px;margin-top:8px}
.med-note{font-size:11px;color:#666}
.med-chip{font-size:11px;border-radius:8px;padding:7px 9px;line-height:1.35}
.med-ok{background:#E6F4EA;color:#168821}
.med-alerta{background:#FDECEA;color:#B71C1C}
.med-neutro{background:#F3F4F6;color:#555}
.med-preview{margin-top:8px}
.hint{font-size:11px;color:#666;line-height:1.4}

#dash-charts{display:grid;grid-template-columns:1fr;gap:10px}

@media (max-width: 420px){
  .dfields2,.fg2{grid-template-columns:1fr}
  .sec-head{flex-wrap:wrap;gap:6px}
  .sec-ordem{max-width:100%;width:100%;margin:0}
  #drawer-body{padding:12px}
  #drawer-hdr{padding:14px 12px 10px}
  #drawer-footer{padding:12px}
  #drawer-footer .btn-primary,#drawer-footer .btn-secondary{flex:1}
}
@media (min-width: 980px){
  #dash-charts{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
#toast{
  position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0) + 12px);
  left:50%;transform:translateX(-50%) translateY(20px);
  background:#1B1B1B;color:#fff;padding:10px 20px;
  border-radius:100px;font-size:13px;font-weight:600;
  white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .2s,transform .2s;z-index:200
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#168821}
#toast.error{background:#E52207}
#toast.del{background:#555}

/* ═══════════════════════════════════════════
   OS PAGE
═══════════════════════════════════════════ */
.os-card{
  background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  border-left:4px solid #1351B4;cursor:pointer
}
.os-card:active{transform:scale(.98)}
.os-card.concluida{border-left-color:#168821}
.os-card.parcial{border-left-color:#B46800}
.os-card.pendente{border-left-color:#E52207}
.os-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.os-id{font-size:11px;color:#aaa;font-weight:700}
.os-local{font-size:14px;font-weight:700;color:#1B1B1B}
.os-predio{font-size:12px;color:#888}
.os-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.os-desc{font-size:12px;color:#666;margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ═══════════════════════════════════════════
   FAB
═══════════════════════════════════════════ */
#fab{

  bottom:calc(70px + env(safe-area-inset-bottom,0) + 16px);

  background:#1351B4;color:#fff;border:none;
  font-size:22px;cursor:pointer;z-index:50;
  box-shadow:0 4px 16px rgba(19,81,180,.4);
  display:flex;align-items:center;justify-content:center;

/* ═══════════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════════ */
.empty{text-align:center;padding:40px 20px;color:#999}
.empty i{font-size:40px;margin-bottom:12px;color:#DDD;display:block}
.empty p{font-size:14px;margin:0}

/* ═══════════════════════════════════════════
   MISC

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ── SUPABASE CONFIG ── */
const SUPA_URL = 'https://thoaqipyhfmromsgzmjs.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRob2FxaXB5aGZtcm9tc2d6bWpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjk5NTksImV4cCI6MjEwMTY0NTk1OX0.1Ig6ijb6SKgeQRgGwM54MyzlVr-n_feSAxaFTwbHRGY';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

/* ── CONVERSORES ── */
function dbToEquip(r) {
  return {
    id: r.id, area: r.area, predio: r.predio, local: r.local,
    tipo: r.tipo, fabricante: r.fabricante || '', modelo: r.modelo || '',
    btu: r.btu || 0,
    funciona: r.funciona, estado: r.estado, obs: r.obs || '',
    refrigPermanente: r.refrig_permanente,
    horasDia: r.horas_dia, diasSemana: r.dias_semana,
    criticidade: r.criticidade, criticidadeManual: r.criticidade_manual,
    tensao: r.tensao, correnteNominal: parseFloat(r.corrente_nominal) || 0,
    patrimonio: r.patrimonio || '',
    dataInstalacao: r.data_instalacao || '',
    ultimaManutencao: r.ultima_manutencao || '',
    refrigerante: r.refrigerante || '',
    areaM2: parseFloat(r.area_m2) || 0,
    peDireito: parseFloat(r.pe_direito) || 0,
    nPessoas: parseInt(r.n_pessoas, 10) || 0,
    dissipacaoW: parseFloat(r.dissipacao_w) || 0,
    fatorInsolacao: parseFloat(r.fator_insolacao) || 1
  };
}

function dbToLog(r) {
  return {
    id: r.id, date: r.data_os, tipo: r.tipo,
    status: r.status, tecnico: r.tecnico || '',
    desc: r.descricao || '', checklist: r.checklist || [],
    tempInsuflamento: parseFloat(r.temp_insuflamento),
    tempRetorno: parseFloat(r.temp_retorno),
    deltaT: parseFloat(r.delta_t),
    correnteMedida: parseFloat(r.corrente_medida),
    pressaoSuccao: parseFloat(r.pressao_succao)
  };
}

/* ── CAMADA DE DADOS SUPABASE ── */
var _logCache = {};

async function loadDataFromSupabase() {
  try {
    var { data, error } = await supa.from('equipamentos').select('*').order('id');
    if (error) throw error;
    DATA = data.map(dbToEquip);
    localStorage.setItem('pmoc_cache_v1', JSON.stringify(DATA));
    return true;
  } catch(e) {
    var s = localStorage.getItem('pmoc_cache_v1');
    if (s) { DATA = JSON.parse(s); return true; }
    return false;
  }
}

async function loadLogsFromSupabase() {
  try {
    var { data, error } = await supa.from('logs_manutencao')
      .select('*').order('data_os', { ascending: false });
    if (error) throw error;
    _logCache = {};
    data.forEach(function(r) {
      if (!_logCache[r.equip_id]) _logCache[r.equip_id] = [];
      _logCache[r.equip_id].push(dbToLog(r));
    });
    return true;
  } catch(e) {
    // fallback legado
    try {
      var s = localStorage.getItem('cmasm13_log_v1');
      if (s) {
        var lg = JSON.parse(s);
        _logCache = {};
        Object.keys(lg).forEach(function(id) { _logCache[parseInt(id)] = lg[id]; });
      }
    } catch(e2) {}
    return false;
  }
}

// Substitui getLog / getEquipLog / getLatestLogDate (serão redefinidas abaixo)
function getLog(){ return _logCache; }
function getEquipLog(id){ return _logCache[id] || []; }
function getLatestLogDate(id){
  var e = getEquipLog(id);
  if (!e.length) return null;
  return e.sort(function(a,b){return b.date.localeCompare(a.date);})[0].date;
}

async function addLogEntryAsync(equipId, entry) {
  try {
    var { data, error } = await supa.from('logs_manutencao').insert({
      equip_id: equipId, data_os: entry.date, tipo: entry.tipo,
      status: entry.status, tecnico: entry.tecnico || null,
      descricao: entry.desc || null, checklist: entry.checklist || [],
      temp_insuflamento: entry.tempInsuflamento,
      temp_retorno: entry.tempRetorno,
      delta_t: entry.deltaT,
      corrente_medida: entry.correnteMedida,
      pressao_succao: entry.pressaoSuccao
    }).select().single();
    if (error) throw error;
    if (!_logCache[equipId]) _logCache[equipId] = [];
    _logCache[equipId].unshift(dbToLog(data));
    return data.id;
  } catch(e) {
    showToast('Erro ao salvar OS', 'error');
    return null;
  }
}

async function delLogEntryAsync(equipId, logId) {
  try {
    var { error } = await supa.from('logs_manutencao').delete().eq('id', logId);
    if (error) throw error;
    if (_logCache[equipId])
      _logCache[equipId] = _logCache[equipId].filter(function(e){return e.id!==logId;});
    return true;
  } catch(e) { return false; }
}

async function saveEquipAsync(equipId, dados){
  try {
    var atual = DATA.find(function(r){ return r.id===equipId; }) || {};
    var payload = Object.assign(dadosEdicaoEquip(atual), dados);
    var { data, error } = await supa.from('equipamentos')
      .update(montarPatchEquipamento(payload))
      .eq('id', equipId)
      .select()
      .single();
    if (error) throw error;
    var idx = DATA.findIndex(function(r){ return r.id===equipId; });
    var equip = dbToEquip(data);
    if (idx>=0) DATA[idx] = equip;
    else DATA.push(equip);
    return equip;
  } catch(e) {
    console.error('save equipment', e);
    showToast('Erro ao salvar equipamento', 'error');
    return null;
  }
}

/* ── REALTIME ── */
function setupRealtime() {
  supa.channel('pmoc-mobile')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'equipamentos' }, function(p) {
      if (p.eventType === 'UPDATE') {
        var i = DATA.findIndex(function(r){return r.id===p.new.id;});
        if (i>=0) DATA[i] = dbToEquip(p.new);
      } else if (p.eventType === 'INSERT') {
        if (!DATA.find(function(r){return r.id===p.new.id;})) DATA.push(dbToEquip(p.new));
      } else if (p.eventType === 'DELETE') {
        DATA = DATA.filter(function(r){return r.id!==p.old.id;});
      }
      renderDash(); renderInv();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'logs_manutencao' }, function(p) {
      if (p.eventType === 'INSERT') {
        var eid = p.new.equip_id;
        if (!_logCache[eid]) _logCache[eid] = [];
        if (!_logCache[eid].find(function(e){return e.id===p.new.id;}))
          _logCache[eid].unshift(dbToLog(p.new));
      } else if (p.eventType === 'DELETE') {
        Object.keys(_logCache).forEach(function(id){
          _logCache[id] = _logCache[id].filter(function(e){return e.id!==p.old.id;});
        });
      }
      renderDash();
    })
    .subscribe();
}

<script>
/* ═══════════════════════════════════════════════════════════
   DATA & STORAGE
═══════════════════════════════════════════════════════════ */
var STORAGE_KEY = 'cmasm13_data_v1';
var LOG_KEY     = 'cmasm13_log_v1';

/* v2: INITIAL_DATA legado removido — os equipamentos são carregados do
   Supabase (loadDataFromSupabase) com fallback no cache localStorage. */
var INITIAL_DATA = [];

var PMOC_INT = {
  'CRÍTICA': {inspecao:30,  preventiva:90,  revisao:180},
  'ALTA':    {inspecao:60,  preventiva:180, revisao:365},
  'MÉDIA':   {inspecao:90,  preventiva:365, revisao:730},
  'BAIXA':   {inspecao:180, preventiva:365, revisao:730}
};
var MAINT_TIPOS = ['INSPEÇÃO','PREVENTIVA','CORRETIVA','REVISÃO','LIMPEZA','RECARGA GÁS','SUBSTITUIÇÃO'];
var CHECKLIST = {
  'SPLIT':['Limpeza dos filtros de ar da evaporadora','Limpeza e desobstrução do dreno de condensado','Verificação do nível de gás refrigerante','Medição de tensão (V) e corrente (A)','Verificação do funcionamento (termostato, modos)','Limpeza da serpentina evaporadora','Inspeção de vazamentos no circuito frigorífico','Verificação de contactores e capacitores','Lubrificação das partes móveis'],
  'PISO/TETO':['Limpeza dos filtros de ar','Limpeza e desobstrução do dreno de condensado','Verificação do nível de gás refrigerante','Medição de tensão (V) e corrente (A)','Verificação do funcionamento geral','Limpeza da serpentina evaporadora e condensadora','Inspeção de vazamentos','Verificação de contactores e capacitores','Lubrificação das partes móveis'],
  'SELF CONTAINED':['Verificação das pressões de alta e baixa (manômetro)','Inspeção e ajuste da correia de transmissão','Limpeza e inspeção dos filtros de ar','Medição de tensão, corrente e potência','Verificação do nível de gás refrigerante','Inspeção do circuito frigorífico (vazamentos)','Limpeza da serpentina condensadora','Verificação dos controles e termostatos','Inspeção do quadro elétrico (fusíveis, contactores)','Análise de vibração e ruídos anormais','Verificação do sistema de drenagem','Lubrificação de rolamentos e partes móveis'],
  'JANELA':['Limpeza do filtro de ar','Verificação do funcionamento geral','Limpeza geral da unidade','Verificação da vedação na parede','Medição de corrente (A)','Verificação de vibração excessiva']
};
var CRIT_COLORS = {'CRÍTICA':'#E52207','ALTA':'#E65100','MÉDIA':'#1565C0','BAIXA':'#33691E'};

var invChip = 'todos', osChip = 'todos', pmocChip = 'todos';
var invOrdem = 'local';

/* ═══════════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════════ */
function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(id){ return document.getElementById(id); }
function val(id){ var e=el(id); return e?e.value:''; }
function fmtDate(iso){ if(!iso)return''; try{var d=new Date(iso+'T12:00:00');return d.toLocaleDateString('pt-BR');}catch(e){return iso;} }
function today(){ return new Date().toISOString().slice(0,10); }

function showToast(msg, type){
  var t = el('toast');
  t.textContent = msg;
  t.className = 'show ' + (type||'');
  setTimeout(function(){ t.className = type||''; }, 2200);
}

function autoCrit(e){
  if(e.criticidadeManual) return e.criticidade;
  if(e.funciona==='NOK') return e.criticidade;
  return e.criticidade;
}

/* ── EDIÇÃO + MEDIÇÕES ── */
function normalizarTextoCampo(v){
  var txt = String(v==null ? '' : v).trim();
  return txt || null;
}
function normalizarNumero(v){
  if(v==null || v==='') return null;
  var n = parseFloat(String(v).replace(',','.'));
  return Number.isFinite(n) ? n : null;
}
function normalizarInteiro(v){
  if(v==null || v==='') return null;
  var n = parseInt(String(v), 10);
  return Number.isFinite(n) ? n : null;
}
function valorCriticidadeEquip(e){
  return (e && e.criticidade) ? e.criticidade : 'BAIXA';
}
function optionsHtml(lista, atual, vazio){
  var html = vazio ? '<option value="">'+esc(vazio)+'</option>' : '';
  return html + lista.map(function(item){
    var valor = typeof item === 'string' ? item : item.value;
    var rotulo = typeof item === 'string' ? item : item.label;
    return '<option value="'+esc(valor)+'"'+(String(atual||'')===String(valor)?' selected':'')+'>'+esc(rotulo)+'</option>';
  }).join('');
}
function faixaPressaoReferencia(refrigerante){
  var ref = String(refrigerante||'').toUpperCase();
  if(ref.indexOf('410')>=0) return {min:110, max:130, rotulo:'110–130 psi (R410A)'};
  if(ref.indexOf('22')>=0) return {min:60, max:70, rotulo:'60–70 psi (R22)'};
  return null;
}
function analisarMedicoes(equip, medidas){
  var tempIns = normalizarNumero(medidas && medidas.tempInsuflamento);
  var tempRet = normalizarNumero(medidas && medidas.tempRetorno);
  var deltaT = normalizarNumero(medidas && medidas.deltaT);
  var corrente = normalizarNumero(medidas && medidas.correnteMedida);
  var pressao = normalizarNumero(medidas && medidas.pressaoSuccao);
  if(deltaT==null && tempIns!=null && tempRet!=null) deltaT = Number((tempRet - tempIns).toFixed(1));
  var itens = [];
  if(deltaT!=null){
    itens.push({chave:'delta_t', rotulo:'ΔT', valor:deltaT, unidade:'°C', referencia:'10–14 °C', ok:deltaT>=10 && deltaT<=14});
  }
  if(corrente!=null){
    var nominal = normalizarNumero(equip && equip.correnteNominal);
    itens.push({
      chave:'corrente', rotulo:'Corrente', valor:corrente, unidade:'A',
      referencia: nominal!=null ? ('±10% de '+nominal+' A') : 'Comparar com a placa',
      ok: nominal==null ? null : (corrente>=nominal*0.9 && corrente<=nominal*1.1)
    });
  }
  if(pressao!=null){
    var faixa = faixaPressaoReferencia(equip && equip.refrigerante);
    itens.push({
      chave:'pressao', rotulo:'Sucção', valor:pressao, unidade:'psi',
      referencia: faixa ? faixa.rotulo : 'Conferir refrigerante/modelo',
      ok: faixa ? (pressao>=faixa.min && pressao<=faixa.max) : null
    });
  }
  return {tempInsuflamento:tempIns, tempRetorno:tempRet, deltaT:deltaT, correnteMedida:corrente, pressaoSuccao:pressao, itens:itens};
}
function renderAnaliseMedicoes(equip, medidas){
  var analise = analisarMedicoes(equip, medidas);
  if(!analise.itens.length && analise.tempInsuflamento==null && analise.tempRetorno==null) return '';
  var chips = analise.itens.map(function(item){
    var cls = item.ok===true ? 'med-ok' : item.ok===false ? 'med-alerta' : 'med-neutro';
    var rotulo = item.ok===true ? 'OK' : item.ok===false ? 'Fora da ref.' : 'Sem ref.';
    return '<div class="med-chip '+cls+'"><strong>'+esc(item.rotulo)+':</strong> '+esc(String(item.valor))+' '+esc(item.unidade)+' · '+esc(item.referencia)+' · '+rotulo+'</div>';
  }).join('');
  var temps = [];
  if(analise.tempInsuflamento!=null) temps.push('Insuflamento '+analise.tempInsuflamento+' °C');
  if(analise.tempRetorno!=null) temps.push('Retorno '+analise.tempRetorno+' °C');
  return '<div class="med-box">' +
    (temps.length?'<div class="med-note">'+temps.join(' · ')+'</div>':'') +
    chips +
    '</div>';
}
function dadosEdicaoEquip(e){
  return {
    area: e.area,
    predio: e.predio,
    local: e.local,
    tipo: e.tipo,
    fabricante: e.fabricante,
    modelo: e.modelo,
    btu: e.btu,
    funciona: e.funciona,

function deveAtualizarEquipNaConclusao(entry){

}
function montarPatchConclusaoManutencao(equip, form){
  if(!deveAtualizarEquipNaConclusao(form)) return null;
  return {
    funciona: form.funciona || equip.funciona,
    estado: form.estado || equip.estado,
    criticidade: form.criticidade || valorCriticidadeEquip(equip),
    criticidadeManual: true,
    obs: form.obs,
    ultimaManutencao: form.date || equip.ultimaManutencao
  };
}

function addLogEntry(e,r){ console.warn('addLogEntry sync obsoleto'); }
function delLogEntry(e,i){ console.warn('delLogEntry sync obsoleto'); }
function saveLog(l){ /* no-op */ }

function nextPmoc(e, tipo){
  var crit = autoCrit(e);
  var interval = (PMOC_INT[crit]||PMOC_INT['BAIXA'])[tipo];
  var lastDate = e.ultimaManutencao || getLatestLogDate(e.id);
  if(!lastDate) return null;
  var d = new Date(lastDate+'T12:00:00');
  d.setDate(d.getDate()+interval);
  return d;
}

function dueBadgeHtml(d){
  if(!d) return '<span class="due-badge due-none">Sem hist.</span>';
  var now=new Date(); var diff=Math.round((d-now)/86400000);
  if(diff<0) return '<span class="due-badge due-late">Vencida '+Math.abs(diff)+'d</span>';
  if(diff<30) return '<span class="due-badge due-soon">'+diff+'d</span>';
  return '<span class="due-badge due-ok">'+fmtDate(d.toISOString().slice(0,10))+'</span>';
}

function critPill(crit){
  var map={'CRÍTICA':'pill-crit','ALTA':'pill-alta','MÉDIA':'pill-media','BAIXA':'pill-baixa'};
  return '<span class="pill '+(map[crit]||'')+'">'+esc(crit)+'</span>';
}
function statusPill(fn){
  if(fn==='OK') return '<span class="pill pill-ok"><i class="fas fa-check" aria-hidden="true"></i> OK</span>';
  if(fn==='NOK') return '<span class="pill pill-nok"><i class="fas fa-times" aria-hidden="true"></i> NOK</span>';
  return '<span class="pill pill-ver"><i class="fas fa-question" aria-hidden="true"></i> VERIFICAR</span>';
}
function statusPillOS(s){
  if(s==='CONCLUÍDA') return '<span class="pill pill-ok">CONCLUÍDA</span>';
  if(s==='PENDENTE') return '<span class="pill pill-nok">PENDENTE</span>';
  return '<span class="pill pill-ver">PARCIAL</span>';
}

/* ═══════════════════════════════════════════════════════════
   INVENTÁRIO
═══════════════════════════════════════════════════════════ */
var CRIT_ORDEM = {'CRÍTICA':0,'ALTA':1,'MÉDIA':2,'BAIXA':3};

/* Próxima manutenção do equipamento: a mais próxima entre inspeção e preventiva.
   null quando não há histórico — nextPmoc() não tem de onde contar o intervalo. */
function proxManut(e){
  var ni = nextPmoc(e,'inspecao'), np = nextPmoc(e,'preventiva');
  if(!ni) return np; if(!np) return ni;
  return ni < np ? ni : np;
}
function isVencido(e){
  var d = proxManut(e);
  return !!d && d < new Date();
}
function cmpInv(a, b){
  if(invOrdem==='predio'){
    var p = (a.predio||'').localeCompare(b.predio||'','pt-BR');
    return p || (a.local||'').localeCompare(b.local||'','pt-BR');
  }
  if(invOrdem==='criticidade'){
    var ca = CRIT_ORDEM[autoCrit(a)], cb = CRIT_ORDEM[autoCrit(b)];
    if(ca===undefined) ca = 99; if(cb===undefined) cb = 99;   // criticidade fora da lista vai para o fim
    return (ca-cb) || (a.local||'').localeCompare(b.local||'','pt-BR');
  }
  if(invOrdem==='vencimento'){
    var da = proxManut(a), db = proxManut(b);
    if(!da && !db) return (a.local||'').localeCompare(b.local||'','pt-BR');
    if(!da) return 1; if(!db) return -1;                       // sem histórico sempre no fim
    return da - db;
  }
  return (a.local||'').localeCompare(b.local||'','pt-BR');
}

  }).sort(cmpInv);

      '</div></div>' +

      statusPill(e.funciona)+critPill(autoCrit(e))+
      '<span class="pill pill-tipo">'+esc(e.tipo)+'</span></div>' +
      '<div class="ec-info">' +
      '<span><i class="fas fa-snowflake" aria-hidden="true"></i>'+btuK+'</span>' +

      '<span><i class="fas fa-calendar-check" aria-hidden="true"></i>'+dueBadgeHtml(proxManut(e))+'</span>' +
      (e.fabricante&&e.fabricante!=='-'?'<span><i class="fas fa-industry" aria-hidden="true"></i>'+esc(e.fabricante)+'</span>':'') +
      (e.modelo?'<span><i class="fas fa-tag" aria-hidden="true"></i>'+esc(e.modelo)+'</span>':'') +

  }).join('');

function getAllOSEntries(){
  var log = getLog();
  var entries = [];
  Object.keys(log).forEach(function(equipId){
    var e = DATA.find(function(r){ return r.id===parseInt(equipId); });
    if(!e) return;
    (log[equipId]||[]).forEach(function(entry){
      entries.push({ equipId:parseInt(equipId), equip:e, entry:entry });
    });
  });
  entries.sort(function(a,b){ return b.entry.date.localeCompare(a.entry.date); });
  return entries;
}

  }).sort(function(a,b){
    var ord=['CRÍTICA','ALTA','MÉDIA','BAIXA'];
    var ca=ord.indexOf(autoCrit(a)), cb=ord.indexOf(autoCrit(b));
    if(ca!==cb) return ca-cb;
    var na=nextPmoc(a,'inspecao'), nb=nextPmoc(b,'inspecao');
    if(!na&&!nb) return 0; if(!na) return 1; if(!nb) return -1;
    return na-nb;
  });

  el('pmoc-cnt').textContent = list.length;

  if(!list.length){
    el('pmoc-list').innerHTML = '<div class="empty"><i class="fas fa-calendar-check" aria-hidden="true"></i><p>Tudo em dia neste filtro!</p></div>';
    return;
  }

  el('pmoc-list').innerHTML = list.map(function(e){
    var nx = nextPmoc(e,'inspecao');
    var np = nextPmoc(e,'preventiva');
    var logCnt = getEquipLog(e.id).length;
    return '<div class="pmoc-row" onclick="openDetail('+e.id+')">' +
      critPill(autoCrit(e)) +
      '<div class="pmoc-info">' +
      '<div class="pmoc-predio">'+esc(e.predio)+'</div>' +
      '<div class="pmoc-local">'+esc(e.local)+' · '+esc(e.tipo)+'</div>' +
      '<div style="font-size:11px;color:#999;margin-top:2px">' +
      'Inspeção: '+dueBadgeHtml(nx)+' Prev.: '+dueBadgeHtml(np)+'</div>' +
      '</div>' +
      '<div style="font-size:11px;color:#aaa;text-align:right"><i class="fas fa-clipboard-list mr1" aria-hidden="true"></i>'+logCnt+'</div>' +
      '</div>';
  }).join('');
}

function renderAlerts(){
  var now = new Date();
  var nokList = DATA.filter(function(e){ return e.funciona==='NOK'; })
    .sort(function(a,b){ var o=['CRÍTICA','ALTA','MÉDIA','BAIXA']; return o.indexOf(autoCrit(a))-o.indexOf(autoCrit(b)); });
  var vencList = DATA.filter(function(e){ var nx=nextPmoc(e,'inspecao'); return nx&&nx<now; })
    .sort(function(a,b){ var o=['CRÍTICA','ALTA','MÉDIA','BAIXA']; return o.indexOf(autoCrit(a))-o.indexOf(autoCrit(b)); });
  var semHist = DATA.filter(function(e){ return !e.ultimaManutencao&&!getLatestLogDate(e.id)&&autoCrit(e)==='CRÍTICA'; });

  var html = '';

  if(nokList.length){
    html += '<div class="sec-head"><span class="sec-title" style="color:#E52207"><i class="fas fa-times-circle mr1" aria-hidden="true"></i>NOK — Fora de Operação</span><span class="sec-count">'+nokList.length+'</span></div>';
    html += nokList.map(function(e){
      return '<div class="alert-card" onclick="openDetail('+e.id+')">' +
        '<div class="alert-icon"><i class="fas fa-times-circle" style="color:#E52207"></i></div>' +
        '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
        '<div class="alert-sub">'+esc(e.predio)+(e.obs?' · '+esc(e.obs):'')+'</div></div>' +
        critPill(autoCrit(e))+'</div>';
    }).join('');
  }

  if(vencList.length){
    html += '<div class="sec-head" style="margin-top:16px"><span class="sec-title" style="color:#F57F17"><i class="fas fa-calendar-times mr1" aria-hidden="true"></i>PMOC Vencida</span><span class="sec-count">'+vencList.length+'</span></div>';
    html += vencList.map(function(e){
      var nx = nextPmoc(e,'inspecao');
      var diff = nx?Math.round((now-nx)/86400000):0;
      return '<div class="alert-card" style="border-left-color:#F57F17" onclick="openDetail('+e.id+')">' +
        '<div class="alert-icon"><i class="fas fa-calendar-times" style="color:#F57F17"></i></div>' +
        '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
        '<div class="alert-sub">'+esc(e.predio)+' · Vencida há '+diff+'d</div></div>' +
        critPill(autoCrit(e))+'</div>';
    }).join('');
  }

  if(semHist.length){
    html += '<div class="sec-head" style="margin-top:16px"><span class="sec-title"><i class="fas fa-question-circle mr1" aria-hidden="true"></i>Críticos Sem Histórico</span><span class="sec-count">'+semHist.length+'</span></div>';
    html += semHist.map(function(e){
      return '<div class="alert-card" style="border-left-color:#B71C1C" onclick="openDetail('+e.id+')">' +
        '<div class="alert-icon"><i class="fas fa-history" style="color:#B71C1C"></i></div>' +
        '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
        '<div class="alert-sub">'+esc(e.predio)+' · Nenhum registro de manutenção</div></div>' +
        critPill(autoCrit(e))+'</div>';
    }).join('');
  }

  if(!html) html = '<div class="empty"><i class="fas fa-check-circle" style="color:#168821"></i><p>Nenhum alerta ativo!</p></div>';

  el('alert-list').innerHTML = html;

  var total = nokList.length + vencList.length;
  el('alert-badge').textContent = total;
  el('alert-badge').style.display = total>0?'block':'none';
}

function openDetail(id){
  var e = DATA.find(function(r){ return r.id===id; }); if(!e) return;
  var logs = getEquipLog(id);
  var lastDate = e.ultimaManutencao || getLatestLogDate(id);
  var crit = autoCrit(e);
  var horas = (e.horasDia||0)*(e.diasSemana||0);
  var ni = nextPmoc(e,'inspecao'); var np = nextPmoc(e,'preventiva');
  var btuK = e.btu? (e.btu/1000).toFixed(0)+'K BTU' : '—';
  var kw = e.btu? (e.btu/3412).toFixed(2)+' kW' : '—';

  el('dh-id').textContent = '#'+id+' · '+esc(e.area);
  el('dh-local').textContent = e.local;
  el('dh-predio').textContent = e.predio;
  el('dh-pills').innerHTML = statusPill(e.funciona)+critPill(crit);

  var logHtml = '';

    logHtml = '<div class="ds"><div class="ds-title"><i class="fas fa-history mr1" aria-hidden="true"></i>Histórico de Manutenção ('+logs.length+')</div>';
    logs.forEach(function(entry){
      var stCls = entry.status==='CONCLUÍDA'?'pill-ok':entry.status==='PARCIAL'?'pill-ver':'pill-nok';
      var done = (entry.checklist||[]).filter(function(c){return c.done;}).length;
      var tot = (entry.checklist||[]).length;
      logHtml += '<div class="log-entry">' +
        '<div class="le-hdr">' +
        '<span class="le-date">'+fmtDate(entry.date)+'</span>' +

        (entry.desc?'<div class="le-desc">'+esc(entry.desc)+'</div>':'') +
        renderAnaliseMedicoes(e, entry) +
        (tot?'<div class="le-chk"><i class="fas fa-tasks mr1" aria-hidden="true"></i>'+done+'/'+tot+' itens do checklist</div>':'') +
        '<button class="le-del" onclick="delLog('+id+',\''+esc(entry.id||'')+'\')" style="margin-top:4px"><i class="fas fa-trash mr1" aria-hidden="true"></i>Excluir</button>' +

function atualizarAnaliseMedicoesForm(equipId){
  var equip = DATA.find(function(r){ return r.id===equipId; });

  var html = renderAnaliseMedicoes(equip, {

    tempRetorno: val('log-temp-ret'),
    deltaT: val('log-delta-t'),
    correnteMedida: val('log-corrente'),
    pressaoSuccao: val('log-pressao')
  });
  var analise = analisarMedicoes(equip, {
    tempInsuflamento: val('log-temp-ins'),

async function saveLogEntry(equipId, clistLen){
  if (window._modoObservador) { showToast('Modo somente leitura', ''); return; }
  var date=val('log-date'), tipo=val('log-tipo'), status=val('log-status');
  if(!date||!tipo){ showToast('Preencha data e tipo','error'); return; }
  var equip = DATA.find(function(r){ return r.id===equipId; });
  var checklist=[];
  for(var i=0;i<clistLen;i++){
    var chk=el('chk-'+i);
    var lbl=el('drawer-body').querySelectorAll('.chk-item span')[i];
    if(chk&&lbl) checklist.push({i:i,label:lbl.textContent.trim(),done:chk.checked});
  }
  var medicoes = analisarMedicoes(equip, {
    tempInsuflamento: val('log-temp-ins'),
    tempRetorno: val('log-temp-ret'),
    deltaT: val('log-delta-t'),
    correnteMedida: val('log-corrente'),
    pressaoSuccao: val('log-pressao')
  });
  var logId = await addLogEntryAsync(equipId,{
    date:date,tipo:tipo,status:status,tecnico:val('log-tec').trim(),desc:val('log-desc').trim(),checklist:checklist,
    tempInsuflamento: medicoes.tempInsuflamento,
    tempRetorno: medicoes.tempRetorno,
    deltaT: medicoes.deltaT,
    correnteMedida: medicoes.correnteMedida,
    pressaoSuccao: medicoes.pressaoSuccao
  });
  if(!logId) return;
  var patchConclusao = montarPatchConclusaoManutencao(equip || {}, {
    date: date,
    tipo: tipo,
    status: status,
    funciona: val('log-equip-funciona'),
    estado: val('log-equip-estado'),
    criticidade: val('log-equip-criticidade'),
    obs: val('log-equip-obs')
  });
  if(patchConclusao) await saveEquipAsync(equipId, patchConclusao);
  showToast('OS registrada com sucesso','ok');
  openDetail(equipId);
  // Refresh
  setTimeout(function(){ renderDash(); }, 100);
}

async function delLog(equipId, logId){
  if(!confirm('Excluir este registro?')) return;
  await delLogEntryAsync(equipId, logId);
  showToast('Registro excluído','del');
  openDetail(equipId);
  renderDash();
}

    var touch = e.touches[0];

<script>

var ctOrc = {};                // os_id -> itens orçamento
var ctExec = {};               // os_id -> registros execução

var ctEvt = {};                // os_id -> eventos de auditoria

};
var CT_STEPS = ['Solicit.','Orçam.','Aprov.','Execução','Fiscal','NF','Encerr.'];

function fmtMoney(v){ return 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function ctStatusPill(s){ var c=CT_STATUS[s]||CT_STATUS['SOLICITADA']; return '<span class="ct-status" style="background:'+c.bg+';color:'+c.fg+'">'+c.label+'</span>'; }
function ctEquip(id){ return DATA.find(function(r){return r.id===id;}) || {local:(id?'#'+id:'Sem equipamento'),predio:'',tipo:'',funciona:'',criticidade:''}; }

/* ══ PERMISSÕES ══ */
function ctCan(acao){
  if (window._modoObservador) return false;
  var r = ctUser ? ctUser.role : 'admin';
  var m = {
    criar:      ['admin','gestor','tecnico'],
    orcar:      ['admin','gestor','tecnico','empresa'],
    aprovar:    ['admin','gestor'],
    executar:   ['admin','gestor','tecnico','empresa','executor'],
    fiscalizar: ['admin','fiscal','gestor'],
    certificar: ['admin','gestor'],
    cancelar:   ['admin','gestor']
  };
  return (m[acao]||[]).indexOf(r) >= 0;
}

/* ══ CARGA DE DADOS ══ */
async function ctLoad(){
  try{
    var r1 = await supa.from('os_contratacao').select('*').order('criado_em',{ascending:false});
    if(r1.error) throw r1.error;
    ctOS = r1.data||[];
    var r2 = await supa.from('os_orcamento_itens').select('*').order('ordem');
    ctOrc = {}; (r2.data||[]).forEach(function(i){ (ctOrc[i.os_id]=ctOrc[i.os_id]||[]).push(i); });
    var r3 = await supa.from('os_execucao').select('*').order('data');
    ctExec = {}; (r3.data||[]).forEach(function(i){ (ctExec[i.os_id]=ctExec[i.os_id]||[]).push(i); });
    var r4 = await supa.from('os_composicao').select('*');
    ctComp = {}; (r4.data||[]).forEach(function(i){ (ctComp[i.os_id]=ctComp[i.os_id]||[]).push(i); });
    var r4b = await supa.from('os_eventos').select('*').order('criado_em');
    ctEvt = {}; ((r4b&&r4b.data)||[]).forEach(function(i){ (ctEvt[i.os_id]=ctEvt[i.os_id]||[]).push(i); });
    var r5 = await supa.from('arp_itens').select('*').order('item');
    ctArp = r5.data||[];
    var s = await supa.auth.getSession();
    var uid = s.data && s.data.session ? s.data.session.user.id : null;
    if(uid){
      var r6 = await supa.from('usuarios').select('*').eq('auth_id',uid).maybeSingle();
      ctUser = r6.data||null;
    }
    ctLoaded = true;
    return true;
  }catch(e){ console.error('ctLoad',e); showToast('Erro ao carregar contratações','error'); return false; }
}

async function ctEnsureLoaded(){ if(!ctLoaded) await ctLoad(); }

function ctSetupRealtime(){
  supa.channel('ct-contratacao')
    .on('postgres_changes',{event:'*',schema:'public',table:'os_contratacao'},function(){ ctLoad().then(function(){ if(ctMode==='contrat') ctRenderList(); }); })
    .on('postgres_changes',{event:'*',schema:'public',table:'os_orcamento_itens'},function(){ ctLoad(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'os_execucao'},function(){ ctLoad(); })
    .subscribe();
}

/* ══ SALDO DAS ATAS ══ */
function ctConsumo(item){
  var q = 0;
  Object.keys(ctComp).forEach(function(osId){
    var os = ctOS.find(function(o){return o.id===osId;});
    if(!os || os.status==='CANCELADA') return;
    ctComp[osId].forEach(function(c){ if(c.item_arp===item) q += Number(c.qtd)||0; });
  });
  return q;
}
function ctSaldoItem(it){ return (it.qtd_empenhada||0) - ctConsumo(it.item); }
/* NEs são GLOBAIS (conferido nos PDFs SIAFI de 28/07/2026): o teto financeiro
   é o valor da NE — a soma dos itens aderidos da RLP (R$ 43.467,13) EXCEDE a
   NE334 em R$ 4.541,02, portanto o controle financeiro usa o valor da NE. */
var CT_NES = {
  '2026NE000335': {forn:'WINS', valor:26521.75},
  '2026NE000334': {forn:'RLP',  valor:38926.11}
};
function ctConsumoNE(ne){
  var t=0;
  Object.keys(ctComp).forEach(function(osId){
    var os = ctOS.find(function(o){return o.id===osId;});
    if(!os || os.status==='CANCELADA') return;
    ctComp[osId].forEach(function(c){
      var it = ctArp.find(function(a){return a.item===c.item_arp;});
      if(it && it.ne===ne) t += (Number(c.qtd)||0)*Number(it.valor_unit);
    });
  });
  return t;
}
function ctSaldoNE(ne){
  var cfg = CT_NES[ne];
  return (cfg?cfg.valor:0) - ctConsumoNE(ne);
}

async function ctSetMode(m){
  ctMode = m;
  var sp=el('seg-pmoc'), sc=el('seg-contrat');
  if(sp) sp.className = 'seg-btn'+(m==='pmoc'?' active':'');
  if(sc) sc.className = 'seg-btn'+(m==='contrat'?' active':'');

  el('ct-chips').style.display = m==='contrat'?'flex':'none';
  var title = document.querySelector('#page-os .sec-title');
  if(title) title.textContent = m==='contrat' ? 'Contratações (ARP)' : 'Ordens de Serviço';
  if(m==='contrat'){ await ctEnsureLoaded(); ctRenderList(); }
  else renderOS();
}

function ctSetChip(btn, v){
  document.querySelectorAll('#ct-chips .chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  ctChipSel = v;
  ctRenderList();
}

function ctRenderList(){
  if(ctChipSel==='saldo'){ ctRenderSaldo(); return; }
  var list = ctOS.filter(function(o){
    if(ctChipSel==='andamento') return ['SOLICITADA','ORCAMENTO','APROVADA','EM_EXECUCAO','EXECUTADA','FISCALIZADA'].indexOf(o.status)>=0;
    if(ctChipSel==='aprovacao') return o.status==='ORCAMENTO' || o.status==='EXECUTADA';
    if(ctChipSel==='encerradas') return o.status==='ENCERRADA' || o.status==='CANCELADA';
    return true;
  });
  el('os-cnt').textContent = list.length;
  if(!list.length){
    el('os-list').innerHTML = '<div class="empty"><i class="fas fa-file-signature" aria-hidden="true"></i>' +
      '<p>Nenhuma contratação neste filtro.<br>Toque <strong>+</strong> para abrir uma solicitação.</p></div>';
    return;
  }
  el('os-list').innerHTML = list.map(function(o){
    var e = ctEquip(o.equip_id);

      '<span style="font-size:11px;color:#888"><i class="fas fa-calendar mr1" aria-hidden="true"></i>'+fmtDate(o.data_solicitacao)+'</span>' +

    'Os saldos por item abaixo controlam as <strong>quantidades</strong> aderidas na ata (soma dos itens RLP = R$ 43.467,13, acima da NE334 — nem toda quantidade caberá no empenho).</div>';
  ['2026NE000335','2026NE000334'].forEach(function(ne){
    var itens = ctArp.filter(function(i){return i.ne===ne;});

    html += '<div class="sec-head"><span class="sec-title">'+(ne==='2026NE000335'?'WINS':'RLP')+' — '+ne+'</span><span class="sec-count">'+itens.length+' itens</span></div>';
    html += itens.map(function(it){
      var saldo = ctSaldoItem(it);
      var pct = it.qtd_empenhada? Math.max(0,Math.min(100,Math.round(saldo/it.qtd_empenhada*100))) : 0;
      return '<div class="saldo-row"><div class="saldo-hdr">' +
        '<span style="font-size:12px;font-weight:800;color:#1351B4">Item '+it.item+'</span>' +
        '<span style="font-size:12px;font-weight:700">'+saldo+' / '+it.qtd_empenhada+' · '+fmtMoney(saldo*it.valor_unit)+'</span></div>' +
        '<div class="saldo-desc">'+esc(it.descricao)+' <span style="color:#999">('+fmtMoney(it.valor_unit)+'/un)</span></div>' +
        '<div class="saldo-bar"><div class="saldo-fill" style="width:'+pct+'%;background:'+(pct<20?'#E52207':pct<50?'#F57F17':'#168821')+'"></div></div></div>';
    }).join('');
  });
  el('os-list').innerHTML = html;
}

  el('drawer-body').innerHTML =
    '<div class="ds"><div class="ds-title"><i class="fas fa-snowflake mr1" aria-hidden="true"></i>Máquina</div>' +
    '<select class="fgs" id="ct-equip-sel">'+opts+'</select>' +
    '<div style="font-size:10px;color:#999;margin-top:6px">⛔ = máquinas NOK aparecem primeiro</div></div>' +
    '<div class="ds"><div class="ds-title"><i class="fas fa-exclamation-circle mr1" aria-hidden="true"></i>Problema / Serviço Necessário</div>' +
    '<textarea class="fgt" id="ct-problema" placeholder="Descreva o defeito ou serviço a contratar…"></textarea>' +
    '<div class="fg2" style="margin-top:8px">' +
    '<div><label class="fgl">Empresa</label><select class="fgs" id="ct-empresa" onchange="ctSyncNE()">' +
    '<option value="RLP">RLP</option><option value="WINS">WINS</option><option value="">A definir</option></select></div>' +
    '<div><label class="fgl">NE</label><select class="fgs" id="ct-ne">' +
    '<option value="2026NE000334">2026NE000334 (RLP)</option><option value="2026NE000335">2026NE000335 (WINS)</option><option value="">—</option></select></div>' +
    '</div></div>';
  el('drawer-footer').innerHTML =
    '<button class="btn-secondary" onclick="closeDrawer()">Cancelar</button>' +
    '<button class="btn-primary" onclick="ctSalvarNova()"><i class="fas fa-paper-plane mr1" aria-hidden="true"></i>Abrir Solicitação</button>';
  openDrawer();
}

function ctSyncNE(){
  var emp = val('ct-empresa');
  var ne = el('ct-ne');
  if(!ne) return;
  if(emp==='RLP') ne.value='2026NE000334';
  else if(emp==='WINS') ne.value='2026NE000335';
}

async function ctSalvarNova(){
  var equipId = parseInt(val('ct-equip-sel'));
  var problema = val('ct-problema').trim();
  if(!equipId || !problema){ showToast('Selecione a máquina e descreva o problema','error'); return; }
  var ano = new Date().getFullYear();
  var seq = ctOS.filter(function(o){ return (o.numero||'').indexOf('/'+ano)>=0; }).length + 1;
  var numero = 'OSC '+String(seq).padStart(3,'0')+'/'+ano;
  var nome = ctUser ? ctUser.nome : '';
  var ins = await supa.from('os_contratacao').insert({
    numero:numero, equip_id:equipId, status:'SOLICITADA', problema:problema,
    empresa:val('ct-empresa')||null, ne:val('ct-ne')||null,
    solicitante:nome, data_solicitacao:today()
  }).select().single();
  if(ins.error){
    if((ins.error.message||'').indexOf('duplicate')>=0){ showToast('Nº já existe — tente de novo','error'); }
    else showToast('Erro ao criar solicitação','error');
    return;
  }
  ctOS.unshift(ins.data);
  showToast(numero+' criada','ok');
  closeDrawer();
  ctRenderList();
}

/* ══ DETALHE DA OS ══ */
function ctOrcTotal(osId){
  return (ctOrc[osId]||[]).reduce(function(s,i){ return s + (Number(i.qtd)||0)*(Number(i.valor_unit)||0); },0);
}
function ctCompTotal(osId){
  return (ctComp[osId]||[]).reduce(function(s,c){
    var it = ctArp.find(function(a){return a.item===c.item_arp;});
    return s + (it? (Number(c.qtd)||0)*Number(it.valor_unit) : 0);
  },0);
}

function ctTimeline(status){
  var cur = (CT_STATUS[status]||{}).step;
  if(cur===-1) return '<div style="font-size:12px;color:#999;margin-bottom:8px"><i class="fas fa-ban mr1" aria-hidden="true"></i>OS cancelada</div>';
  var h = '<div class="ct-timeline">';
  CT_STEPS.forEach(function(s,i){
    var cls = i<cur?'done':(i===cur?'curr':'');
    h += '<div class="ct-step '+cls+'"><div class="ct-dot">'+(i<cur?'<i class="fas fa-check" aria-hidden="true"></i>':(i+1))+'</div><span>'+s+'</span></div>';
    if(i<CT_STEPS.length-1) h += '<div class="ct-bar '+(i<cur?'done':'')+'"></div>';
  });
  return h+'</div>';
}

function ctOpenOS(osId){
  var o = ctOS.find(function(x){return x.id===osId;}); if(!o) return;
  var e = ctEquip(o.equip_id);
  var itens = ctOrc[osId]||[];
  var regs = ctExec[osId]||[];
  var comps = ctComp[osId]||[];
  var total = ctOrcTotal(osId);
  var ro = window._modoObservador;

  el('dh-id').textContent = o.numero+' · '+(o.ne||'sem NE');
  el('dh-local').textContent = e.local;
  el('dh-predio').textContent = e.predio+(o.empresa?' · '+o.empresa:'');
  el('dh-pills').innerHTML = ctStatusPill(o.status);

  var h = ctTimeline(o.status);

  /* — Solicitação — */
  h += '<div class="ds"><div class="ds-title"><i class="fas fa-exclamation-circle mr1" aria-hidden="true"></i>1 · Solicitação</div>' +
    '<div class="dfield"><label>Problema / serviço</label><div class="dval" style="font-size:13px">'+esc(o.problema||'—')+'</div></div>' +
    '<div class="dfields2">' +
    '<div class="dfield"><label>Solicitante</label><div class="dval" style="font-size:12px">'+esc(o.solicitante||'—')+'</div></div>' +
    '<div class="dfield"><label>Data</label><div class="dval" style="font-size:12px">'+fmtDate(o.data_solicitacao)+'</div></div>' +
    '</div></div>';

  /* — Orçamento — */
  var podeOrcar = !ro && ctCan('orcar') && (o.status==='SOLICITADA'||o.status==='ORCAMENTO');
  h += '<div class="ds"><div class="ds-title"><i class="fas fa-file-invoice-dollar mr1" aria-hidden="true"></i>2 · Delineamento / Orçamento</div>';
  if(itens.length){
    h += itens.map(function(i){
      return '<div class="orc-item"><span class="orc-tipo '+i.tipo+'">'+(i.tipo==='SERVICO'?'SERV':'MAT')+'</span>' +
        '<div class="orc-desc">'+esc(i.descricao)+'<div style="color:#999;font-size:10px">'+i.qtd+' × '+fmtMoney(i.valor_unit)+'</div></div>' +
        '<span class="orc-val">'+fmtMoney(i.qtd*i.valor_unit)+'</span>' +
        (podeOrcar?'<button class="orc-del" title="Excluir item" aria-label="Excluir item" onclick="ctDelOrcItem(\''+osId+'\',\''+i.id+'\')"><i class="fas fa-trash" aria-hidden="true"></i></button>':'') +
        '</div>';
    }).join('');
    h += '<div class="ct-total-row"><span>TOTAL ORÇADO</span><span style="color:#1351B4">'+fmtMoney(total)+'</span></div>';
  } else {
    h += '<div style="font-size:12px;color:#999">Nenhum item lançado ainda.</div>';
  }
  if(podeOrcar){
    h += '<div style="margin-top:10px;border-top:1px dashed #DDD;padding-top:10px">' +
      '<div class="fg2"><div><label class="fgl">Tipo</label><select class="fgs" id="oi-tipo"><option value="SERVICO">Serviço</option><option value="MATERIAL">Material/Peça</option></select></div>' +
      '<div><label class="fgl">Qtd</label><input class="fgi" id="oi-qtd" type="number" value="1" min="0.01" step="0.01"/></div></div>' +
      '<label class="fgl">Descrição</label><input class="fgi" id="oi-desc" placeholder="Ex.: Substituição do compressor 36.000 BTU"/>' +
      '<label class="fgl" style="margin-top:8px">Valor unitário (R$)</label><input class="fgi" id="oi-vu" type="number" min="0" step="0.01" placeholder="0,00"/>' +
      '<button class="btn-secondary" style="width:100%;margin-top:8px" onclick="ctAddOrcItem(\''+osId+'\')"><i class="fas fa-plus mr1" aria-hidden="true"></i>Adicionar item</button></div>';
  }
  if(o.status==='ORCAMENTO' && o.parecer_aprovacao){
    h += '<div style="margin-top:8px;font-size:11px;color:#B46800;background:#FEF3E2;border-radius:8px;padding:8px"><i class="fas fa-undo mr1" aria-hidden="true"></i>Devolvida: '+esc(o.parecer_aprovacao)+'</div>';
  }
  if(o.aprovador){
    h += '<div style="margin-top:8px;font-size:11px;color:#168821"><i class="fas fa-check-circle mr1" aria-hidden="true"></i>Aprovado por '+esc(o.aprovador)+' em '+fmtDate(o.data_aprovacao)+'</div>';
  }
  /* botões do orçamento */
  h += '<div class="ct-btn-row">';
  if(!ro && o.status==='SOLICITADA' && itens.length && ctCan('orcar'))
    h += '<button class="btn-primary" onclick="ctMudarStatus(\''+osId+'\',\'ORCAMENTO\')"><i class="fas fa-paper-plane mr1" aria-hidden="true"></i>Enviar p/ aprovação</button>';
  if(!ro && o.status==='ORCAMENTO' && ctCan('aprovar')){
    h += '<button class="btn-success" onclick="ctAprovar(\''+osId+'\')"><i class="fas fa-check mr1" aria-hidden="true"></i>Aprovar orçamento</button>';
    h += '<button class="btn-danger" onclick="ctDevolver(\''+osId+'\')"><i class="fas fa-undo mr1" aria-hidden="true"></i>Devolver</button>';
  }
  h += '</div></div>';

  /* — Execução — */
  var stepExec = (CT_STATUS[o.status]||CT_STATUS['SOLICITADA']).step;
  if(stepExec>=2 && o.status!=='CANCELADA'){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-hard-hat mr1" aria-hidden="true"></i>3 · Execução ('+regs.length+' registro'+(regs.length===1?'':'s')+')</div>';
    regs.forEach(function(r){
      var med = r.medicoes||{};
      var medTxt = [];
      if(med.temp_insuflamento) medTxt.push('Insufl.: '+med.temp_insuflamento+'°C');
      if(med.temp_retorno) medTxt.push('Retorno: '+med.temp_retorno+'°C');
      if(med.corrente) medTxt.push('Corrente: '+med.corrente+'A');
      if(med.pressao) medTxt.push('Pressão: '+med.pressao+' psi');
      var fotos = (r.fotos||[]).map(function(p){
        var u = supa.storage.from('os-fotos').getPublicUrl(p).data.publicUrl;
        return '<a href="'+u+'" target="_blank"><img src="'+u+'" loading="lazy"/></a>';
      }).join('');
      h += '<div class="exec-reg"><div class="le-hdr"><span class="le-date">'+fmtDate(r.data)+'</span>' +
        (r.executor?'<span class="le-tec"><i class="fas fa-user mr1" aria-hidden="true"></i>'+esc(r.executor)+'</span>':'')+'</div>' +
        (r.descricao?'<div class="le-desc">'+esc(r.descricao)+'</div>':'') +
        (medTxt.length?'<div class="le-chk"><i class="fas fa-thermometer-half mr1" aria-hidden="true"></i>'+medTxt.join(' · ')+'</div>':'') +
        (fotos?'<div class="foto-grid">'+fotos+'</div>':'') +
        '</div>';
    });
    var podeExec = !ro && ctCan('executar');
    if(podeExec && o.status==='EM_EXECUCAO'){
      h += '<div style="margin-top:8px;border-top:1px dashed #DDD;padding-top:10px">' +
        '<label class="fgl">Descrição do serviço executado</label>' +
        '<textarea class="fgt" id="ex-desc" placeholder="O que foi feito, peças aplicadas…"></textarea>' +
        '<div class="fg2" style="margin-top:8px">' +
        '<div><label class="fgl">Insufl. (°C)</label><input class="fgi" id="ex-ti" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Retorno (°C)</label><input class="fgi" id="ex-tr" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Corrente (A)</label><input class="fgi" id="ex-corr" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Pressão (psi)</label><input class="fgi" id="ex-press" type="number" step="1"/></div></div>' +
        '<label class="fgl" style="margin-top:8px">Fotos</label>' +
        '<input class="fgi" id="ex-fotos" type="file" accept="image/*" capture="environment" multiple/>' +
        '<button class="btn-secondary" style="width:100%;margin-top:8px" onclick="ctAddExec(\''+osId+'\')"><i class="fas fa-camera mr1" aria-hidden="true"></i>Registrar execução</button></div>';
    }
    h += '<div class="ct-btn-row">';
    if(podeExec && o.status==='APROVADA')
      h += '<button class="btn-primary" onclick="ctMudarStatus(\''+osId+'\',\'EM_EXECUCAO\')"><i class="fas fa-play mr1" aria-hidden="true"></i>Iniciar execução</button>';
    if(podeExec && o.status==='EM_EXECUCAO' && regs.length)
      h += '<button class="btn-success" onclick="ctMudarStatus(\''+osId+'\',\'EXECUTADA\')"><i class="fas fa-flag-checkered mr1" aria-hidden="true"></i>Concluir execução</button>';
    h += '</div></div>';
  }

  /* — Fiscalização — */
  if(((CT_STATUS[o.status]||{}).step>=4) && o.status!=='CANCELADA'){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-user-shield mr1" aria-hidden="true"></i>4 · Fiscalização</div>';
    if(o.fiscal){
      h += '<div style="font-size:12px;color:#168821"><i class="fas fa-check-circle mr1" aria-hidden="true"></i>Aprovada por '+esc(o.fiscal)+' em '+fmtDate(o.data_fiscalizacao)+'</div>' +
        (o.parecer_fiscal?'<div class="le-desc" style="margin-top:4px">'+esc(o.parecer_fiscal)+'</div>':'');
    } else if(!ro && o.status==='EXECUTADA' && ctCan('fiscalizar')){
      h += '<label class="fgl">Parecer do fiscal</label>' +
        '<textarea class="fgt" id="fis-parecer" placeholder="Serviços conferidos conforme orçamento aprovado…"></textarea>' +
        '<div class="ct-btn-row">' +
        '<button class="btn-success" onclick="ctFiscalizar(\''+osId+'\',true)"><i class="fas fa-check mr1" aria-hidden="true"></i>Aprovar execução</button>' +
        '<button class="btn-danger" onclick="ctFiscalizar(\''+osId+'\',false)"><i class="fas fa-undo mr1" aria-hidden="true"></i>Devolver</button></div>';
    } else {
      h += '<div style="font-size:12px;color:#999">Aguardando conclusão da execução.</div>';
    }
    h += '</div>';
  }

  /* — Certificação / NF + composição da ata — */
  if(((CT_STATUS[o.status]||{}).step>=5) && o.status!=='CANCELADA'){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-file-invoice mr1" aria-hidden="true"></i>5 · NF · Composição da Ata · Certificação</div>';
    /* composição */
    var compTotal = ctCompTotal(osId);
    if(comps.length){
      h += comps.map(function(c){
        var it = ctArp.find(function(a){return a.item===c.item_arp;})||{descricao:'',valor_unit:0};
        return '<div class="orc-item"><span class="orc-tipo SERVICO">ATA</span>' +
          '<div class="orc-desc">Item '+c.item_arp+' — '+esc(it.descricao)+'<div style="color:#999;font-size:10px">'+c.qtd+' × '+fmtMoney(it.valor_unit)+'</div></div>' +
          '<span class="orc-val">'+fmtMoney(c.qtd*it.valor_unit)+'</span>' +
          (!ro && o.status==='FISCALIZADA' && ctCan('certificar')?'<button class="orc-del" title="Excluir item" aria-label="Excluir item" onclick="ctDelComp(\''+osId+'\',\''+c.id+'\')"><i class="fas fa-trash" aria-hidden="true"></i></button>':'') +
          '</div>';
      }).join('');
      var dif = (o.valor_orcado||total) - compTotal;
      h += '<div class="ct-total-row"><span>COMPOSTO (ATA)</span><span>'+fmtMoney(compTotal)+'</span></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:'+(Math.abs(dif)<1?'#168821':'#E52207')+';margin-top:2px">' +
        '<span>Diferença vs orçado</span><span>'+fmtMoney(dif)+'</span></div>';
    }
    if(!ro && o.status==='FISCALIZADA' && ctCan('certificar')){
      var arpOpts = ctArp.map(function(it){
        var saldo = ctSaldoItem(it);
        return '<option value="'+it.item+'" '+(saldo<=0?'disabled':'')+'>'+it.item+' · '+(it.ne==='2026NE000335'?'WINS':'RLP')+' · '+fmtMoney(it.valor_unit)+' · saldo '+saldo+'</option>';
      }).join('');
      h += '<div style="margin-top:8px;border-top:1px dashed #DDD;padding-top:10px">' +
        '<label class="fgl">Item da ata</label><select class="fgs" id="cp-item">'+arpOpts+'</select>' +
        '<div class="fg2" style="margin-top:8px"><div><label class="fgl">Qtd</label><input class="fgi" id="cp-qtd" type="number" value="1" min="1" step="1"/></div>' +
        '<div style="display:flex;align-items:flex-end"><button class="btn-secondary" style="width:100%" onclick="ctAddComp(\''+osId+'\')"><i class="fas fa-plus mr1" aria-hidden="true"></i>Adicionar</button></div></div>' +
        '<div class="fg2" style="margin-top:10px">' +
        '<div><label class="fgl">Nota Fiscal</label><input class="fgi" id="cf-nf" value="'+esc(o.nf||'')+'" placeholder="NF nº"/></div>' +
        '<div><label class="fgl">Data NF</label><input class="fgi" id="cf-datanf" type="date" value="'+(o.data_nf||today())+'"/></div></div>' +
        '<button class="btn-success" style="width:100%;margin-top:10px" onclick="ctCertificar(\''+osId+'\')"><i class="fas fa-stamp mr1" aria-hidden="true"></i>Certificar e encerrar OS</button></div>';
    }
    if(o.status==='ENCERRADA'){
      h += '<div style="margin-top:8px;font-size:12px;color:#168821"><i class="fas fa-stamp mr1" aria-hidden="true"></i>NF '+esc(o.nf||'—')+' ('+fmtDate(o.data_nf)+') certificada por '+esc(o.certificador||'—')+' em '+fmtDate(o.data_certificacao)+'</div>';
    }
    h += '</div>';
  }

  /* — Histórico / auditoria — */
  var evts = ctEvt[osId]||[];
  if(evts.length){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-history mr1" aria-hidden="true"></i>Histórico / Auditoria ('+evts.length+')</div>' +
      evts.map(function(ev){
        var dt = ev.criado_em ? new Date(ev.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
        var tx = ev.evento==='MUDANÇA DE STATUS'
          ? ((CT_STATUS[ev.de_status]||{label:ev.de_status||'—'}).label+' → '+(CT_STATUS[ev.para_status]||{label:ev.para_status||'—'}).label)
          : (ev.detalhes||'');
        return '<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #F0F0F0;font-size:11px">' +
          '<span style="color:#999;white-space:nowrap">'+dt+'</span>' +
          '<div style="flex:1;min-width:0"><strong>'+esc(ev.evento)+'</strong>'+(tx?' — '+esc(tx):'')+
          (ev.usuario?'<div style="color:#888">'+esc(ev.usuario)+(ev.role?' ('+esc(ev.role)+')':'')+'</div>':'')+'</div></div>';
      }).join('')+'</div>';
  }

  el('drawer-body').innerHTML = h;

  var foot = '<button class="btn-secondary" onclick="closeDrawer()" title="Fechar" aria-label="Fechar"><i class="fas fa-times" aria-hidden="true"></i></button>' +
    '<button class="btn-secondary" onclick="ctPrintOS(\''+osId+'\')" title="Imprimir OS" aria-label="Imprimir OS"><i class="fas fa-print" aria-hidden="true"></i></button>';
  if(!ro && ctCan('cancelar') && ['SOLICITADA','ORCAMENTO','APROVADA'].indexOf(o.status)>=0)
    foot += '<button class="btn-danger" style="flex:1" onclick="ctCancelar(\''+osId+'\')"><i class="fas fa-ban mr1" aria-hidden="true"></i>Cancelar OS</button>';
  el('drawer-footer').innerHTML = foot;
  openDrawer();
}

/* ══ AÇÕES ══ */
async function ctUpd(osId, patch, msg){
  var r = await supa.from('os_contratacao').update(patch).eq('id',osId).select().single();
  if(r.error){ showToast('Erro ao atualizar','error'); return false; }
  var i = ctOS.findIndex(function(o){return o.id===osId;});
  if(i>=0) ctOS[i]=r.data;
  if(msg) showToast(msg,'ok');
  return true;
}

async function ctMudarStatus(osId, novo){
  var patch = {status:novo};
  if(novo==='ORCAMENTO'){ patch.valor_orcado = ctOrcTotal(osId); patch.parecer_aprovacao = null; }
  if(await ctUpd(osId, patch, 'Status: '+(CT_STATUS[novo]||{}).label)){ ctOpenOS(osId); ctRenderList(); }
}

async function ctAprovar(osId){
  var nome = ctUser?ctUser.nome:'';
  if(await ctUpd(osId,{status:'APROVADA',aprovador:nome,data_aprovacao:today(),valor_orcado:ctOrcTotal(osId)},'Orçamento aprovado')){ ctOpenOS(osId); ctRenderList(); }
}

async function ctDevolver(osId){
  var motivo = prompt('Motivo da devolução do orçamento:');
  if(motivo===null) return;
  if(await ctUpd(osId,{status:'SOLICITADA',parecer_aprovacao:motivo},'Devolvida p/ ajuste')){ ctOpenOS(osId); ctRenderList(); }
}

async function ctFiscalizar(osId, aprovado){
  var parecer = val('fis-parecer').trim();
  var nome = ctUser?ctUser.nome:'';
  if(aprovado){
    if(await ctUpd(osId,{status:'FISCALIZADA',fiscal:nome,data_fiscalizacao:today(),parecer_fiscal:parecer},'Execução aprovada pelo fiscal')){ ctOpenOS(osId); ctRenderList(); }
  } else {
    if(!parecer){ showToast('Informe o motivo no parecer','error'); return; }
    if(await ctUpd(osId,{status:'EM_EXECUCAO',parecer_fiscal:parecer},'Devolvida p/ correção')){ ctOpenOS(osId); ctRenderList(); }
  }
}

async function ctCertificar(osId){
  var nf = val('cf-nf').trim();
  if(!nf){ showToast('Informe o nº da NF','error'); return; }
  var comps = ctComp[osId]||[];
  if(!comps.length){ showToast('Adicione a composição de itens da ata','error'); return; }
  var nome = ctUser?ctUser.nome:'';
  if(await ctUpd(osId,{status:'ENCERRADA',nf:nf,data_nf:val('cf-datanf')||today(),certificador:nome,data_certificacao:today()},'OS certificada e encerrada')){ ctOpenOS(osId); ctRenderList(); }
}

async function ctCancelar(osId){
  if(!confirm('Cancelar esta OS?')) return;
  if(await ctUpd(osId,{status:'CANCELADA'},'OS cancelada')){ closeDrawer(); ctRenderList(); }
}

/* — orçamento itens — */
async function ctAddOrcItem(osId){
  var desc = val('oi-desc').trim();
  var qtd = parseFloat(val('oi-qtd'))||0;
  var vu = parseFloat(val('oi-vu'))||0;
  if(!desc || qtd<=0 || vu<0){ showToast('Preencha descrição, qtd e valor','error'); return; }
  var r = await supa.from('os_orcamento_itens').insert({
    os_id:osId, tipo:val('oi-tipo'), descricao:desc, qtd:qtd, valor_unit:vu,
    ordem:(ctOrc[osId]||[]).length
  }).select().single();
  if(r.error){ showToast('Erro ao adicionar item','error'); return; }
  (ctOrc[osId]=ctOrc[osId]||[]).push(r.data);
  ctOpenOS(osId);
}

async function ctDelOrcItem(osId, itemId){
  var r = await supa.from('os_orcamento_itens').delete().eq('id',itemId);
  if(r.error){ showToast('Erro ao remover','error'); return; }
  ctOrc[osId] = (ctOrc[osId]||[]).filter(function(i){return i.id!==itemId;});
  ctOpenOS(osId);
}

/* — execução: fotos comprimidas + upload — */
function ctCompressFoto(file){
  return new Promise(function(res, rej){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1280;
      var w = img.width, hh = img.height;
      if(w>max||hh>max){ var k=Math.min(max/w,max/hh); w=Math.round(w*k); hh=Math.round(hh*k); }
      var cv = document.createElement('canvas'); cv.width=w; cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/jpeg',0.8);
    };
    img.onerror = rej;
    img.src = url;
  });
}

async function ctAddExec(osId){
  var desc = val('ex-desc').trim();
  var files = (el('ex-fotos')||{files:[]}).files;
  if(!desc && !files.length){ showToast('Descreva o serviço ou anexe fotos','error'); return; }
  showToast('Enviando registro…','');
  var paths = [];
  for(var i=0;i<files.length;i++){
    try{
      var blob = await ctCompressFoto(files[i]);
      var path = osId+'/'+Date.now()+'_'+i+'.jpg';
      var up = await supa.storage.from('os-fotos').upload(path, blob, {contentType:'image/jpeg'});
      if(up.error) throw up.error;
      paths.push(path);
    }catch(e){ console.error('foto',e); showToast('Falha no upload de uma foto','error'); }
  }
  var med = {};
  if(val('ex-ti')) med.temp_insuflamento = parseFloat(val('ex-ti'));
  if(val('ex-tr')) med.temp_retorno = parseFloat(val('ex-tr'));
  if(val('ex-corr')) med.corrente = parseFloat(val('ex-corr'));
  if(val('ex-press')) med.pressao = parseFloat(val('ex-press'));
  var nome = ctUser?ctUser.nome:'';
  var r = await supa.from('os_execucao').insert({
    os_id:osId, data:today(), executor:nome, descricao:desc, medicoes:med, fotos:paths
  }).select().single();
  if(r.error){ showToast('Erro ao registrar execução','error'); return; }
  (ctExec[osId]=ctExec[osId]||[]).push(r.data);
  showToast('Execução registrada','ok');
  ctOpenOS(osId);
}

/* — composição da ata — */
async function ctAddComp(osId){
  var item = parseInt(val('cp-item'));
  var qtd = parseFloat(val('cp-qtd'))||0;
  if(!item || qtd<=0){ showToast('Selecione item e quantidade','error'); return; }
  var it = ctArp.find(function(a){return a.item===item;});
  if(!it){ showToast('Item inválido','error'); return; }
  var saldo = ctSaldoItem(it);
  if(qtd>saldo){ showToast('Excede o saldo do item ('+saldo+')','error'); return; }
  // teto financeiro da NE (empenho global)
  var dispNE = ctSaldoNE(it.ne);
  if(qtd*Number(it.valor_unit) > dispNE + 0.005){
    showToast('Excede o teto da NE — disponível '+fmtMoney(dispNE),'error'); return;
  }
  var r = await supa.from('os_composicao').insert({os_id:osId,item_arp:item,qtd:qtd}).select().single();
  if(r.error){ showToast('Erro ao adicionar','error'); return; }
  (ctComp[osId]=ctComp[osId]||[]).push(r.data);
  ctOpenOS(osId);
}

async function ctDelComp(osId, compId){
  var r = await supa.from('os_composicao').delete().eq('id',compId);
  if(r.error){ showToast('Erro ao remover','error'); return; }
  ctComp[osId] = (ctComp[osId]||[]).filter(function(c){return c.id!==compId;});
  ctOpenOS(osId);
}
